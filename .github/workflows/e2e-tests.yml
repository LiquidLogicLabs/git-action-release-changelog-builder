name: E2E Tests

on:
  workflow_call:  # Called by release workflow
  workflow_dispatch:  # Manual trigger only

concurrency:
  group: ${{ github.workflow || 'E2E Tests' }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Runs for workflow_call/workflow_dispatch; tag pushes are not used here
    runs-on: ubuntu-latest
    environment: TEST
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # Local repo (current repository) test cases
          - name: 'Local - No tags (both auto-detected)'
            repo_type: 'local'
            fromTag_provided: false
            toTag_provided: false
          - name: 'Local - FromTag only (toTag auto-detected)'
            repo_type: 'local'
            fromTag_provided: true
            toTag_provided: false
          - name: 'Local - Both tags specified'
            repo_type: 'local'
            fromTag_provided: true
            toTag_provided: true

          # Remote repo (traefik/traefik) test cases
          - name: 'Remote - No tags (both auto-detected)'
            repo_type: 'remote'
            fromTag_provided: false
            toTag_provided: false
          - name: 'Remote - FromTag only (toTag auto-detected)'
            repo_type: 'remote'
            fromTag_provided: true
            toTag_provided: false
          - name: 'Remote - Both tags specified'
            repo_type: 'remote'
            fromTag_provided: true
            toTag_provided: true

    env:
      TEST_GITHUB_FROM_TAG: ${{ vars.TEST_GITHUB_FROM_TAG || '' }}
      TEST_GITHUB_TO_TAG: ${{ vars.TEST_GITHUB_TO_TAG || '' }}
      TEST_GITHUB_REPO: ${{ vars.TEST_GITHUB_REPO || '' }}

    # Run action from committed dist only (no build). Ensures E2E fails if dist is
    # unbundled (e.g. tsc output instead of ncc), matching how consumers run the action.
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false
          fetch-depth: 0  # Full history for tag/commit range

      - name: Skip if test config missing
        if: |
          (matrix.scenario.repo_type == 'remote' && env.TEST_GITHUB_REPO == '') ||
          (matrix.scenario.fromTag_provided == true && env.TEST_GITHUB_FROM_TAG == '') ||
          (matrix.scenario.toTag_provided == true && env.TEST_GITHUB_TO_TAG == '')
        env:
          Z_MATRIX_SCENARIO_NAME: ${{ matrix.scenario.name }}
          Z_MATRIX_SCENARIO_REPO_TYPE: ${{ matrix.scenario.repo_type }}
          Z_TEST_GITHUB_REPO: ${{ env.TEST_GITHUB_REPO }}
          Z_TEST_GITHUB_FROM_TAG: ${{ env.TEST_GITHUB_FROM_TAG }}
          Z_TEST_GITHUB_TO_TAG: ${{ env.TEST_GITHUB_TO_TAG }}
        run: |
          echo "⚠️ Skipping E2E: missing required test configuration"
          echo "Scenario: ${Z_MATRIX_SCENARIO_NAME}"
          echo "Repo Type: ${Z_MATRIX_SCENARIO_REPO_TYPE}"
          echo "Test Repo: ${Z_TEST_GITHUB_REPO}"
          echo "FromTag: ${Z_TEST_GITHUB_FROM_TAG}"
          echo "ToTag: ${Z_TEST_GITHUB_TO_TAG}"
          exit 0

      - name: Run E2E test - ${{ matrix.scenario.name }}
        if: |
          (matrix.scenario.repo_type == 'local' || env.TEST_GITHUB_REPO != '') &&
          (matrix.scenario.fromTag_provided == false || env.TEST_GITHUB_FROM_TAG != '') &&
          (matrix.scenario.toTag_provided == false || env.TEST_GITHUB_TO_TAG != '')
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          platform: github
          repo: ${{ matrix.scenario.repo_type == 'local' && github.repository || env.TEST_GITHUB_REPO }}
          mode: PR
          from-tag: ${{ matrix.scenario.fromTag_provided && env.TEST_GITHUB_FROM_TAG || '' }}
          to-tag: ${{ matrix.scenario.toTag_provided && env.TEST_GITHUB_TO_TAG || '' }}
          token: ${{ secrets.TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-tag-annotations: true
